[package]
name = "oniris-core"
version = "1.2.0"
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "oniris_core"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
parking_lot = "0.12"
tracing = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
nucleo-matcher = "0.3.1"
postcard = { version = "1.1.3", features = ["use-std"] }
url = "2"
semver = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "gif", "jpeg", "webp"] }
base64 = "0.23"
tempfile = "3"
getrandom = "0.3"
ammonia = "4.2.4"
chrono-tz = "0.10"
tract-onnx = "0.23"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
percent-encoding = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
