name: Publication

on:
  push:
    tags: ['v*']

# Deux étiquettes poussées de suite ne se marchent pas dessus.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Vérifier les versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$TAG"
          node tools/release/check-version.mjs "$TAG"

      - name: Lire les notes de version
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$f" ]; then
            echo "::error::Notes de version manquantes : $f"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$f"; then
            echo "::error::Notes de version vides : $f"
            exit 1
          fi
          {
            echo 'body<<NOTES_EOF'
            cat "$f"
            echo
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tests
        run: |
          node --test tools/release/check-version.test.mjs
          cargo test -p oniris-core
          cargo test -p oniris
          pnpm vitest run

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Oniris ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
