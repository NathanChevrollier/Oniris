[package]
name = "oniris"
version = "0.1.0"
description = "Tableau de bord personnel pour Windows"
edition = "2021"

[lib]
name = "oniris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oniris-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }
# Client MCP de Zenytt (même version que Zenytt) ; le processus est lancé par nous (CREATE_NO_WINDOW, arrêt à la fermeture).
# Serveur : `oniris.exe --mcp-relay` (mcp_relay.rs), lancé par Claude Code.
rmcp = { version = "~3.4.0", default-features = false, features = ["client", "transport-async-rw", "server", "transport-io"] }
getrandom = "0.3"
url = "2"
tauri-plugin-dialog = "2"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
ignore = "0.4"
notify = "8"
dirs = "6"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Networking_NetworkListManager",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
perf = []
custom-protocol = ["tauri/custom-protocol"] # embarque le frontend (build release)

[dev-dependencies]
tempfile = "3"
# Faux serveur Zenytt des tests (examples/fake_zenytt.rs, compilé par `cargo test`).
rmcp = { version = "~3.4.0", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
