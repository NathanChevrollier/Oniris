[package]
name = "oniris-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "oniris_core"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
parking_lot = "0.12"
tracing = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }
