# Configuration openwakeword/train.py pour « Dis Iris » / « Hé Iris » (modèle principal). Chemins relatifs à $WW_HOME.
model_name: dis_iris
target_phrase: ["Dis Iris", "Hé Iris"]
custom_negative_phrases: []
n_samples: 20000
n_samples_val: 2000
tts_batch_size: 50
augmentation_batch_size: 16
# 1 seulement : train.py dimensionne les caractéristiques sur le nombre de fichiers, pas sur les tours.
augmentation_rounds: 1
piper_sample_generator_path: ./piper-sample-generator
output_dir: ./output
rir_paths: ["./data/rir"]
background_paths: ["./data/background", "./data/ambient"]
# Ton ambiance pèse 3× plus : c'est le bruit qu'Oniris entendra vraiment.
background_paths_duplication_rate: [1, 3]
false_positive_validation_data_path: ./data/validation_set_features.npy
feature_data_files:
  ACAV100M_sample: ./data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy
batch_n_per_class:
  ACAV100M_sample: 1024
  adversarial_negative: 50
  positive: 50
model_type: dnn
layer_size: 64
steps: 100000
max_negative_weight: 1000
target_false_positives_per_hour: 0.5
