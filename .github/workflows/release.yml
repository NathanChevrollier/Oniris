name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch: # essai à blanc : tout sauf notes et publication

# Deux étiquettes poussées de suite ne se marchent pas dessus.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: pnpm install --frozen-lockfile

      - name: Vérifier les versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node tools/release/check-version.mjs "$TAG"
          else
            node tools/release/check-version.mjs
          fi

      - name: Lire les notes de version
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$f" ]; then
            echo "::error::Notes de version manquantes : $f"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$f"; then
            echo "::error::Notes de version vides : $f"
            exit 1
          fi
          {
            echo 'body<<NOTES_EOF'
            cat "$f"
            echo
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tests
        run: |
          node --test tools/release/check-version.test.mjs
          cargo test -p oniris-core
          cargo test -p oniris
          pnpm vitest run

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Oniris ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
